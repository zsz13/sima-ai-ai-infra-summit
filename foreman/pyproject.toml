[project]
name = "foreman"
version = "0.1.0"
description = "Spoken-spec zero-shot inspection on SiMa.ai Modalix"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

# The edge agent (edge/foreman_edge.py) deliberately has NO dependencies beyond
# the standard library plus what the DevKit's PyNeat environment already
# provides (pyneat, numpy, cv2). Nothing here is installed on the board.

[dependency-groups]
# OPTIONAL local development backend (edge/local_edge.py). Not needed for the
# Modalix path and never installed on the board: `uv sync --group local`.
# faster-whisper rather than mlx-whisper on purpose - mlx-whisper resolves torch,
# scipy and numba, while CTranslate2 needs none of them and already brings the
# onnxruntime the detector uses. See docs/LOCAL_BACKEND.md.
local = [
    "onnxruntime>=1.20",    # detector; CoreML execution provider on Apple Silicon
    "faster-whisper>=1.1",  # ASR via CTranslate2, int8 on CPU
    "pillow>=11.0",         # JPEG encode/decode for evidence frames
    "numpy>=2.0",
    "mlx-vlm>=0.7",         # VLM on Metal; Apple Silicon only
]

dev = [
    "pytest>=8.3",
    "anyio>=4.6",
    "pillow>=11.0",   # test harness only, for placeholder evidence frames
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RET", "PTH"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"edge/*" = ["PTH123"]   # stdlib-only on the board; no pathlib dependency wanted

[tool.pyright]
include = ["host", "tests"]
exclude = ["edge"]       # board-only modules cannot resolve on a dev host
pythonVersion = "3.11"
